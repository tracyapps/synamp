[project]
name = "synamp-analyzer"
version = "0.2.0"
description = "SynAmp offline analysis worker — runs on the brain machine, never on the NAS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Permissive-licensed DSP stack only. See docs/synamp/DECISIONS.md (D6):
    # AGPL and non-commercial components must stay out of anything distributed.
    #   numpy ...... BSD-3-Clause
    #   scipy ...... BSD-3-Clause
    #   soundfile .. BSD-3-Clause (bundles libsndfile, LGPL — used as a library,
    #                not modified, which the LGPL permits)
    #   pyloudnorm . MIT
    #   audioread . MIT (falls back to the OS audio stack for AAC/M4A, which
    #                libsndfile cannot decode at all)
    #   tinytag .... MIT (reads title/artist/album tags for the export; pure Python)
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "audioread>=3.0",
    "tinytag>=2.0",
]

# Model-backed stages are opt-in extras, so the default install stays inside D6:
#   listen (voice stage: singing/speech + instruments, listen.py)
#     onnxruntime ... MIT. Runs the model on Apple Silicon and Intel Macs,
#                     Windows and Linux. Intel Macs: the last build for them is
#                     1.23.x (macOS 13 or newer, Python 3.11–3.13), so it's
#                     pinned there; everywhere else gets a current one.
#     weights ....... PANNs CNN14 (Zenodo 3987831), as an ONNX file in
#                     ~/panns_data made by `model convert` (below). Weights
#                     licence and AudioSet terms NOT yet confirmed: private,
#                     owner-only use until they are; not redistributed yet.
#     onnx .......... Apache-2.0. Builds that file here from the checkpoint,
#                     without PyTorch (model_build.py), checked against
#                     PyTorch's numbers (cnn14-reference.json).
#   convert (the PyTorch way to make it, model_export.py; for checking)
#     torch ......... BSD-3-Clause      torchlibrosa .. MIT      librosa .. ISC
#     onnx .......... Apache-2.0
# Still to triage:
#   audio embeddings .... a permissively-licensed encoder (non-commercial
#                         weights like MERT/MuQ may only ever be a private,
#                         non-distributed option)
#   lyrics .............. LRCLIB (data licence unverified) or local ASR
# See the sound-booth and brain dossiers for the trade.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
listen = [
    "onnxruntime>=1.23,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.24; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Builds the model from the checkpoint without PyTorch (model_build.py).
    "onnx>=1.17",
]
convert = [
    "torch>=2.4",
    "torchlibrosa>=0.1.0",
    "onnx>=1.17",
    "onnxruntime>=1.23,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.24; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.scripts]
synamp-analyze = "synamp_analyzer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
# PyTorch's numbers for the test sounds, to check a model built without it.
synamp_analyzer = ["cnn14-reference.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
