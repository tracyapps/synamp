    - generic [ref=f5e39]:
      - heading "One release; every performer still credited." [level=2] [ref=f5e40]
      - paragraph [ref=f5e41]: Separate release identity from track credits. A 2Pac release can have one reviewed Album Artist while each song retains its featured names. Joint collaboration albums can keep a joint album credit. Multi-artist soundtracks can use Various Artists plus compilation/release metadata; a single-artist soundtrack should retain its artist.
      - table [ref=f5e43]:
        - rowgroup [ref=f5e44]:
          - row [ref=f5e45]:
            - columnheader "Option" [ref=f5e46]
            - columnheader "What it solves" [ref=f5e47]
            - columnheader "What must be reviewed" [ref=f5e48]
        - rowgroup [ref=f5e49]:
          - row [ref=f5e50]:
            - cell "Consistent Album Artist" [ref=f5e51]
            - cell "Album ownership stays stable across track-level collaborations." [ref=f5e52]
            - cell "Edition, release and joint album credit; do not overwrite track Artist." [ref=f5e53]
          - row [ref=f5e54]:
            - cell "Explicit multiple artists" [ref=f5e55]
            - cell "Each performer becomes browsable, while the original credit reads naturally." [ref=f5e56]
            - cell "Roles, IDs, aliases and ambiguous names; punctuation alone is not proof." [ref=f5e57]
          - row [ref=f5e58]:
            - cell "Virtual release grouping" [ref=f5e59]
            - cell "One browsing album can reference several physical folders." [ref=f5e60]
            - cell "Candidate fragments, conflicting metadata, reversible approval and retained source keys." [ref=f5e61]
          - row [ref=f5e62]:
            - cell "Tag/folder cleanup" [ref=f5e63]
            - cell "Portable organization across music programs." [ref=f5e64]
            - cell "Dry run, collisions, originals, recovery and scan order before any live write." [ref=f5e65]
      - paragraph [ref=f5e66]: Navidrome's current documentation supports separate display and multi-valued artist credits, and configurable album identity. Beets files normal albums by album artist, with distinct compilation and soundtrack paths. SynAmp can adopt those distinctions while preserving its folder-level Library Care contract.
    - generic [ref=f5e67]:
      - heading "A precise workspace for a large catalog." [level=2] [ref=f5e68]
      - paragraph [ref=f5e69]:
        - text: The local implementation adds
        - strong [ref=f5e70]: list, grid and table
        - text: views, column toggles, ascending/descending sorting and full-result grouping. The expandable advanced panel contains multi-select albums/songs/artist credits, inclusive year bounds, field rules with AND/OR and NOT, contains/exact/wildcard/similar-spelling matching.
      - paragraph [ref=f5e71]: Grouping by album artist, artist credit, album title, decade or genre provides the first pivot layer. Counts come from all matching entities before pagination; overlapping memberships are labeled. Grouping an album title does not merge distinct folder releases.
      - paragraph [ref=f5e72]: Exact matching ignores case and accents while retaining punctuation. Wildcards use * for any text and ? for one character, anchored to a whole field. Similar spelling allows bounded typos and never renames anything. Types and year range always narrow the combined text expression. Artist rows retain full credits rather than inventing individual identities.
      - paragraph [ref=f5e73]: List and grid albums keep track expansion and playback. Table columns persist as a browser presentation preference. Fully nested pivot dimensions, durable saved views, shareable filter URLs and “create playlist from all filtered songs” are separate follow-up tasks in the canonical plan.
    - generic [ref=f5e74]:
      - heading "Browse planets, then follow a path." [level=2] [ref=f5e75]
      - paragraph [ref=f5e76]: "The approved first slice is a separate Galaxy section: artist planets, full-pool search, alphabetical/song-count arrangements, pan/zoom, dragging, random artist discovery and album/song detail. Planet size means number of song files. It does not imply popularity, influence or musical similarity; screen distance has no similarity meaning."
      - figure "Design concept, approved for planets and album/song drill-down. The generated counts, connections and artwork are invented placeholders, not evidence. The initial implementation has no collaboration edges or fetched artwork." [ref=f5e77]:
        - img "Approved Galaxy concept board with a desktop artist-planet canvas and detail panel, phone portrait canvas above a detail sheet, and phone landscape canvas beside details. Counts, links and artwork are illustrative." [ref=f5e78]
      - paragraph [ref=f5e80]:
        - text: Explicit feat/ft/featuring credits may contribute to a
        - emphasis [ref=f5e81]: parsed-credit candidate
        - text: planet. Raw credits remain available and the candidate is labeled. Names such as AC/DC or Earth, Wind & Fire remain intact. A graph-wide web of every collaboration would obscure discovery; future connections should begin around the selected artist, with supporting tracks and candidate status visible.
      - group [ref=f5e82]:
        - generic "See the current local implementation (synthetic smoke fixture)" [ref=f5e83] [cursor=pointer]
      - paragraph [ref=f5e84]:
        - strong [ref=f5e85]: D3.js
        - text: is the visualization library from the brainstorm. Its hierarchy/force/zoom tools can support later tree, radial and relationship layouts. The initial bounded SVG view uses the existing React stack. Mobile keeps the visual before detail controls; keyboard artist selection and zoom buttons provide alternatives to gestures.
    - generic [ref=f5e86]:
      - heading "Discovery should lead somewhere useful." [level=2] [ref=f5e87]
      - paragraph [ref=f5e88]: Current actions use SynAmp's existing playback and per-song playlist addition. Planned common entity cards will offer favorites, durable searchable tags/notes, album/library jumps, and playlist creation from a precisely described selection. A visible menu must duplicate right-click actions.
      - paragraph [ref=f5e89]:
        - text: "The roadmap retains every brainstorm: verified collaboration paths and Kevin Bacon-style traversal; optional no-edge artist space; collaborator or album branches; nested pivot order; most played with honest history coverage; tree/radial/flower layouts; group dragging and saved pins; restrained motion with reduced-motion fallback; and random artist/album/song exploration. These features have distinct dependencies and acceptance checks in"
        - link "LE03–LE10" [ref=f5e90] [cursor=pointer]:
          - /url: ../../../synamp/plans/LIBRARY-EXPLORER.md
        - text: .
    - generic [ref=f5e91]:
      - heading "MilkDrop now fills the canvas." [level=2] [ref=f5e92]
      - paragraph [ref=f5e93]: The old Retina canvas had a 2400×1600 drawing buffer but a 1200×800 final renderer viewport, explaining the lower-left quarter image. Startup and resize now pass physical pixel dimensions consistently, including DPR-only changes. The full-screen dialog contains background scrolling and restores it on Close/Escape.
      - paragraph [ref=f5e94]: Fresh isolated checks exercised actual Butterchurn WebGL at Retina startup/resize, DPR changes/cap, portrait/landscape and reopen. Every final viewport matched the whole buffer. This establishes the local component fix; owner confirmation in the live Brave app and real library playback remain distinct checks.
