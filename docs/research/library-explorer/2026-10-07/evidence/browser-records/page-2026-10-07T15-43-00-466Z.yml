    - generic [ref=f5e29]:
      - heading "The repeated albums are real folder fragments." [level=2] [ref=f5e30]
      - paragraph [ref=f5e31]:
        - text: A read-only exported snapshot contains
        - strong [ref=f5e32]: 46,117 track records
        - text: ", 5,597 artist-credit labels and 8,387 folder album groups. Album Artist is present on only"
        - strong [ref=f5e33]: 22.235%
        - text: of tracks; a MusicBrainz release ID is present on 0.284%. These are file and label counts, not verified unique recordings or people.
      - paragraph [ref=f5e34]:
        - text: “Dirty Harry, Green Lantern, &” spans
        - strong [ref=f5e35]: 34 tracks in 19 folders
        - text: ", with no Album Artist or release ID. Some of those credits belong outside the 2Pac family. SynAmp groups albums by folder, so those rows are consistent with the current storage. The user's later Brave analysis counter (10,299 / 47,117) describes newer live progress, not this earlier export."
