<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="reliability-title reliability-desc">
  <title id="reliability-title">Measurement honesty: produced vs declared fields, and the reliability gates</title>
  <desc id="reliability-desc">Two field lists, produced fields used with confidence and declared but inert fields, feed a reliability gate: tempo confidence below 0.5 is damped, timing fields need a measured grid, and unknown is never treated as zero. The gates output to scoring (ordering only) and to learning (feature hypotheses paused on suspect metrics; entity signals still learn).</desc>

  <g fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <rect x="24" y="32" width="346" height="212" rx="4"/>
    <rect x="24" y="264" width="346" height="168" rx="4"/>
    <rect x="420" y="110" width="340" height="168" rx="4"/>
    <rect x="800" y="96" width="376" height="100" rx="4"/>
    <rect x="800" y="210" width="376" height="100" rx="4"/>
    <path d="M40 98H354M40 328H354M436 158H744"/>
    <path d="M378 186H406M406 180.5L414 186L406 191.5"/>
    <path d="M768 146H786M786 140.5L794 146L786 151.5"/>
    <path d="M768 260H786M786 254.5L794 260L786 265.5"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E8E6E1">
    <text x="44" y="66">Produced</text>
    <text x="44" y="292">Declared</text>
    <text x="444" y="144">Reliability gates</text>
    <text x="824" y="138">Scoring</text>
    <text x="824" y="244">Learning</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#98A2AD">
    <text x="44" y="86">(used with confidence)</text>
    <text x="44" y="312">(no producer yet — inert)</text>
    <text x="444" y="218">timing fields need a measured grid</text>
    <text x="824" y="164">(ordering only)</text>
    <text x="824" y="272" fill="#E8E6E1">feature hypotheses paused on suspect metrics</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#98A2AD">
    <text x="44" y="116">bpm</text>
    <text x="44" y="135">tempo_confidence</text>
    <text x="44" y="154">pulse_clarity</text>
    <text x="44" y="173">onset_rate</text>
    <text x="44" y="192">percussiveness</text>
    <text x="44" y="211">loudness</text>
    <text x="44" y="230">beat/timing-gated fields</text>
    <text x="44" y="346">arousal</text>
    <text x="44" y="365">valence</text>
    <text x="44" y="384">danceability</text>
    <text x="44" y="403">instruments.*</text>
    <text x="44" y="422">vocal_fraction</text>
  </g>
  <text x="444" y="186" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#98A2AD"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tempo_confidence</tspan><tspan> &lt; 0.5 → damped</tspan></text>
  <!-- the one honesty line (gold accent) -->
  <text x="444" y="250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#D4A757">unknown ≠ zero — never filled in</text>
  <text x="824" y="294" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13.5" fill="#E8E6E1">entity signals still learn</text>
</svg>
