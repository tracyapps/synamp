        - paragraph [ref=f2e69]:
          - strong [ref=f2e70]: The two halves.
          - text: "The translation layer carries nine goal bundles (focus, pump_up, dance, calm, sleep, catharsis, nostalgia, drive, chores), whose research weights never outrank the user's own words; accuracy classes that include contradictions — resolved as two labelled readings plus a clarifying ask, never a silent choice; asks, never guesses for vague or impossible requests; and sequencing arcs that re-order the filtered list without ever betraying a hard constraint. The learning layer is epoch-v1: sessions split on a 30-minute silence gap, a day change, or a session-key change, with a 30-minute live window; evidence and hides compose through one bounded saturation that can re-order but never breaks a hard rule; reliability-weighted keep/skip centroids learn small attribute-level tastes; proposals are the only channel that crosses a session; exploration ships off."
        - paragraph [ref=f2e71]:
          - strong [ref=f2e72]: The guarantees that answer the original ask.
          - emphasis [ref=f2e73]: Isolation
          - text: ": a different day, session, or hour cannot bend this moment's ranking — proven by byte-equality when foreign events are appended."
          - emphasis [ref=f2e74]: Honesty
          - text: ": null is never zero, and a method's rejection is not musical truth."
          - emphasis [ref=f2e75]: Consent
          - text: ": nothing crosses a session without a yes, and forget is one button — append-only; the log is marked, never edited."
        - paragraph [ref=f2e76]:
          - strong [ref=f2e77]: Verification posture.
          - text: "The suite stands at 218 tests / 216 pass, plus one pre-existing macOS red and one skip; both type-checks exit 0; a deterministic 8-scenario / 86-check harness re-runs byte-identically apart from its timestamp. Independent reviews (code, bias, psychology, production) closed with fixes landed, and every evidence path is carried in the delivery manifest. Honest limits: magnitudes and thresholds are candidate values — hypotheses, not tuned evidence; fixtures are synthetic, so no real-music evidence yet."
