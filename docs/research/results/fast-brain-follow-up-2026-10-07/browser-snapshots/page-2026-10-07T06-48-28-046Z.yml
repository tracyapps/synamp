            - text: "are the one attribute-level learner: from kept tracks and corroborated negatives (repeat-skips, \"not now\", reason-coded thumbs), it builds small Rocchio-shaped centroids over five produced axes (bpm, loudness, crest factor, onset rate, percussiveness). Gates: ≥3 keeps, ≥2 rejects, ≥60% coverage, spread-based shrinkage; β = 0.5 vs γ = 0.15 (γ < β per the IR-textbook convention); per-axis parts ≤ ±0.5, feature term ≤ ±1.0. Missing measurements contribute nothing and say why — null is never zero (A3 §3.3c; B2 §4)."
