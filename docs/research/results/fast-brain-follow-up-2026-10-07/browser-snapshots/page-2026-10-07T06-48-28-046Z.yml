        - list [ref=f2e505]:
          - listitem [ref=f2e506]:
            - strong [ref=f2e507]: "\"Tempo unclear — tap it\", partially shipped."
            - text: The spot-check is live (right / half / double / counted-in-threes / tap-to-replace / "no steady beat"), and user-verified values outrank measured ones — a correction holds while the measured BPM still matches [INT-1]. Tap-the-cycle for 5/7/9/11 is planned [C2 S2].
          - listitem [ref=f2e508]:
            - strong [ref=f2e509]: Never auto-4/4.
            - text: No metre field is emitted, so nothing asserts 4/4 or any bar length; no bar-level hard rules [C2 P11].
          - listitem [ref=f2e510]:
            - strong [ref=f2e511]: No auto genre→culture claims.
            - text: Tags are weak hints; "latin party music" reads dance from "party" and asks about "latin"; no "Latin = danceable" claim [C2 P2, E1].
          - listitem [ref=f2e512]:
            - strong [ref=f2e513]: Culture-flavoured defaults, labelled.
            - text: No tradition-named default ships at all [A2 §4.3]; what ships is the calibration line — "Tempo/energy bands are research starting points, not universal — they stay soft and learn from your session feedback and spot-check corrections." Culture notes are code metadata, unrendered [H3 E3; C2 F7].
        - heading "3.3 Ethics guardrails as design constraints" [level=3] [ref=f2e514]
        - paragraph [ref=f2e515]: "The anchors are named: CARE, with its shift \"from regulated consultation to value-based relationships\" [CC-47]; UNDRIP rights over cultural heritage and traditional cultural expressions, including free, prior and informed consent [CC-49]; and the Indigenous Protocol & AI paper's insistence on no single unified statement [CC-48]. In practice: public sources only; no sacred or restricted knowledge; no ceremonial inference from audio; attribution in the appendix, which names the traditions used here specifically (Ewe; Sámi; gamelan/kotekan; Yolŋu manikay; Māori taonga pūoro; others) [H3 E3]. Nothing crosses a session without an explicit yes; exploration ships off; adjustments are bounded (±0.15), explainable, reward-free; mood is never inferred from behaviour — only explicit sad or angry language opens catharsis [C2 P4–P6, S10, S14; H1-8]."
        - heading "3.4 Bias statements, quotable" [level=3] [ref=f2e516]
        - paragraph [ref=f2e517]: Twelve lines adapted from C2's inventory; each is true of the shipped slice and quotable as-is.
        - list [ref=f2e518]:
          - listitem [ref=f2e519]:
            - strong [ref=f2e520]: "Bands are starting points, never laws:"
            - text: "\"Tempo/energy bands are research starting points, not universal — they stay soft and learn from your session feedback and spot-check corrections.\" [CC-29/30/36/37]"
          - listitem [ref=f2e521]:
            - strong [ref=f2e522]: "Tempo is the weakest signal:"
            - text: octave errors (60/120/240) are a named MIR failure class; low-confidence tempo is damped or refused, never stated as fact; tap-the-cycle remains planned. [CC-37; INT-1; C2 S2]
          - listitem [ref=f2e523]:
            - strong [ref=f2e524]: "No universal \"energy\":"
            - text: asks compile to labelled proxies with named inputs; loudness smallest-weighted because LUFS is not perceived intensity. [CC-43–45]
          - listitem [ref=f2e525]:
            - strong [ref=f2e526]: "No genre→culture claims:"
            - text: tags are weak hints; "latin party music" reads dance, not culture, and asks about "latin". [C2 P2]
          - listitem [ref=f2e527]:
            - strong [ref=f2e528]: "Sensitive words are never product language:"
            - text: "\"tribal\", \"primitive\", \"exotic\", \"gypsy\", \"world music\" appear nowhere in shipped code or copy — only echoed back from the user's own prompt. [C2 P1]"
          - listitem [ref=f2e529]:
            - strong [ref=f2e530]: "Attribution, not absorption — with a caveat:"
            - text: the appendix names traditions and peoples; shipped code cites rule ids, names no one, and culture-note rendering stays open. [H3 E3; C2 F1]
          - listitem [ref=f2e531]:
            - strong [ref=f2e532]: "No invented traditions, no sacred-knowledge inference:"
            - text: ceremonial function is never inferred from audio; no tradition-named default ships before consultation and a decision record. [A2 §4.2–4.3]
          - listitem [ref=f2e533]:
            - strong [ref=f2e534]: "Quiet-time and ceremony is a named gap, not a feature:"
            - text: no ceremonial-flag mechanism exists; user exclusions stay hard; a user-taggable context flag is the recommended next step. [C2 F10]
          - listitem [ref=f2e535]:
            - strong [ref=f2e536]: "Learning is epoch-scoped, not person-scoped; nothing crosses a session without a yes:"
            - text: implicit behaviour hard-masks at the session boundary; only deliberate signals and accepted proposals cross. [C2 S9, S10]
          - listitem [ref=f2e537]:
            - strong [ref=f2e538]: "Suspect measurements can't teach feature tastes:"
            - text: a skip on low-reliability material is identity-level evidence only, never a tempo or rhythm hypothesis — a method's rejection is not musical truth. [A2 §5 r12; INT-2]
          - listitem [ref=f2e539]:
            - strong [ref=f2e540]: "Null is never zero:"
            - text: unmeasured fields stay unknown with "not measured" reasons; a missing tag is not absence. [C2 S13]
          - listitem [ref=f2e541]:
            - strong [ref=f2e542]: "Where a protection isn't built, the report says so:"
            - text: still open — ceremony flags, metre-correction depth, angry-word coverage (added after review; not user-tested). [C2 S15; H1-8]
        - paragraph [ref=f2e543]: "Boundary note: behaviour claims rest on code and probes on a synthetic fixture — none is evidence about real music; A2's UNRETRIEVED list stays un-upgraded."
