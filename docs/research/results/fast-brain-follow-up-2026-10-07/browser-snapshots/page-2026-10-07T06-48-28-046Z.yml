          - paragraph [ref=f2e439]: 03 · Chapter
          - heading "Bias, culture, and measurement honesty" [level=1] [ref=f2e440]
        - heading "3.1 Dominant-culture bias is a correctness problem" [level=3] [ref=f2e441]
        - paragraph [ref=f2e442]: "Every default in a playlist brain is a claim about how music works. SynAmp inherits defaults built for Western, equal-tempered, 4/4 pop: one global tempo per track, key as a twelve-tone template, loudness as a stand-in for intensity, \"energy\" as one dial. On a real library they are confidently wrong — and learnable. Bias here is a correctness problem: measurements are a moving target, and a system that will not admit it builds lists on claims it cannot support [A2 §0, §3]."
        - paragraph [ref=f2e443]: "Counterexamples:"
        - list [ref=f2e444]:
          - listitem [ref=f2e445]:
            - strong [ref=f2e446]: Ewe timeline patterns.
            - text: The gankogui bell carries the twelve-pulse standard pattern ⟨2212221⟩; 3:2 relations underpin typical West African polyrhythmic textures [CC-1, CC-2]. Several true pulses coexist, so onset analysis can lock onto the wrong layer — low pulse clarity can describe fully rhythmic music. Ambiguity is not "no beat" (CC-1 full text UNRETRIEVED; CC-2 tertiary).
          - listitem [ref=f2e447]:
            - strong [ref=f2e448]: Indian tala.
            - text: Metre is cyclic and additive — the same 14 beats group differently (Jhoomra 3+4+3+4 vs Dhamar), the sam carries the weight, tempo is elastic [CC-6]. State-of-the-art beat tracking, meter estimation and downbeat detection on Carnatic, Hindustani and Turkish material is "not adequate" [CC-38].
          - listitem [ref=f2e449]:
            - strong [ref=f2e450]: Gamelan.
            - text: Slendro and pelog are per-ensemble tunings ("island to island, village to village") with deliberate paired-instrument beating; 12-TET chroma models misreport key, and interlocking kotekan "sounds faster than any single human could possibly play" — a double-time trap [CC-8, CC-10, CC-11].
          - listitem [ref=f2e451]:
            - strong [ref=f2e452]: Sámi yoik — ontology, not genre.
            - text: Yoik is wordless and often unaccompanied — "singing into being" a person, landscape or animal, not singing about one [CC-16, CC-17]. The right behaviour is abstention plus artist-provided descriptions.
        - paragraph [ref=f2e453]: "The machine side is a moving target. Tempo estimation has a named octave-error class (60/120/240), and its standard metric forgives factors 2, 3, ½, ⅓ [CC-37]. Dataset skew is systematic: canonical tempo sets are Western/electronic-heavy with documented mislabels; similarity models diverge from human cross-cultural judgments across nine traditions [CC-42]. SynAmp's own case: 7,351 onsets, phase concentration ≈0.034 — pulse trackable, timing withheld [INT-2]. \"Energy carried by microtiming\" stays a labelled candidate [CC-46]."
        - paragraph [ref=f2e454]: "The listener is enculturated too: 12-month-olds respond culture-specifically; adults without exposure miss foreign non-isochronous metres; the groove inverted-U inverts outside 4/4 for Western listeners [CC-29, CC-30, CC-35, CC-36]. Universal \"energy\" semantics is unsupported at both ends of the chain [A2 §2]."
        - heading "3.2 What shipped, in response" [level=3] [ref=f2e455]
        - paragraph [ref=f2e456]: The response is honesty machinery, not cleverer scores.
        - list [ref=f2e457]:
          - listitem [ref=f2e458]:
            - strong [ref=f2e459]: No universal "energy".
            - text: Energy asks compile to labelled proxies with named inputs (tempo, onsets, percussiveness, loudness) — loudness smallest-weighted, because LUFS is a normalisation standard, not felt intensity [CC-43–45; C2 P3].
          - listitem [ref=f2e460]:
            - strong [ref=f2e461]: Soft-only for declared fields.
            - text: "Mood, arousal, valence, danceability and the other unproduced fields never supply measurements — constraints stay soft, carrying the \"no producer yet\" note [C2 P10]. Documented caveat: neutral terms still enter the soft average as a constant-0.5 saturation, shifting feedback and MMR margins [H3 E1]."
          - listitem [ref=f2e462]:
            - strong [ref=f2e463]: Reliability gates.
            - text: "BPM is gated by tempo confidence (full ≥ 0.5; damped with a note below; refused at ≤ 0.2 or missing); beat-stage fields are timing-gated. \"A method's rejection is not independent musical truth\": rejected tracks are never called arrhythmic — rejection lowers confidence and asks, not asserts [C2 P9; INT-2, INT-3]."
        - 'figure "Figure 4 · Measurement honesty: which fields are trusted, which are gated, and why unknown is never zero." [ref=f2e464]':
          - 'img "Measurement honesty: produced vs declared fields, and the reliability gates Two field lists, produced fields used with confidence and declared but inert fields, feed a reliability gate: tempo confidence below 0.5 is damped, timing fields need a measured grid, and unknown is never treated as zero. The gates output to scoring (ordering only) and to learning (feature hypotheses paused on suspect metrics; entity signals still learn)." [ref=f2e465]':
