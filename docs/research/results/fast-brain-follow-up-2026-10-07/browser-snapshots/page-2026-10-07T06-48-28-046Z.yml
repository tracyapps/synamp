          - text: "The guarantee is byte-equality, not a promise: derive for a day-1 moment, append arbitrary day-2 implicit events, derive again — byte-identical output; day-1 implicit events never move day-2 values (B2 §2; C1's probes: 20/0). The suite also exercises boundaries (29:59 keeps / 30:00 exact keeps / 30:01 splits; midnight with a 60-second gap), flood bounds (20 loves / 20 skips ⇒ |bonus| ≤ 0.15), determinism (reversed and interleaved insertion orders byte-identical; lab re-runs identical, hash 6532f3f3…37ab3a), hide expiry at exactly +30:00, reset semantics, and proposal boundaries (2 epochs ⇒ none; 3/2 ⇒ exactly one). C1 re-ran all of it adversarially from the code (probe batches 20/0, 41/0, 33/0); brain-lab scenarios cover the same ground:"
