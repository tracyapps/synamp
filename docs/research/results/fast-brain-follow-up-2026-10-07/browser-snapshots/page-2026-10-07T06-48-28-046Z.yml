                - strong [ref=f2e1835]: epoch
              - cell [ref=f2e1836]:
                - text: "The learning window: one listening session, split by session change, a 30-minute idle gap, or local midnight. Implicit learning"
                - strong [ref=f2e1837]: never crosses an epoch boundary
                - text: — a closed epoch contributes exactly nothing. Missing
                - code [ref=f2e1838]: session_id
                - text: events form their own bucket.
            - row [ref=f2e1839]:
              - cell [ref=f2e1840]:
                - strong [ref=f2e1841]: daypart
              - cell "Coarse time-of-day label attached to an epoch (morning 05–12 / afternoon 12–17 / evening 17–22 / night 22–05, from the epoch start). A display/evidence convention only — no empirical basis claimed." [ref=f2e1842]
            - row [ref=f2e1843]:
              - cell [ref=f2e1844]:
                - strong [ref=f2e1845]: hide (persistent vs session)
              - cell [ref=f2e1846]:
                - text: A suppressed track.
                - strong [ref=f2e1847]: Persistent remove
                - text: = playlist-scoped, lasts until restored (
                - code [ref=f2e1848]: hidden_by_you
                - text: ).
                - strong [ref=f2e1849]: Session hide
                - text: = epoch-wide, from
                - code [ref=f2e1850]: skip_early
                - text: ×2 or
                - code [ref=f2e1851]: not_now
                - text: ; clears when the session ends (or via "Forget this session";
                - code [ref=f2e1852]: hidden_by_session
                - text: ). Both leave the strict tier; the two counts are reported separately (no dead Restore buttons).
            - row [ref=f2e1853]:
              - cell [ref=f2e1854]:
                - strong [ref=f2e1855]: proposal
              - cell [ref=f2e1856]:
                - text: A cross-epoch suggestion — the
                - emphasis [ref=f2e1857]: only
                - text: channel through which learning crosses epochs. Backed by evidence
                - code [ref=f2e1858]: "{epochs, dates, dayparts}"
                - text: and conservative thresholds; requires user confirmation before anything changes. Accepting appends a normal global thumb event (track subjects) or records the decision (artist subjects); never an automatic playback change.
            - row [ref=f2e1859]:
              - cell [ref=f2e1860]:
                - strong [ref=f2e1861]: evidence weight
              - 'cell "How strongly one event counts: magnitude × confidence (e.g., love +2.0 @ c=1.0; repeat +1.0 @ c=0.7), then decayed by the epoch half-life. These are the numbers the learning is built from — all candidate values, tunable, versioned with the policy." [ref=f2e1862]'
            - row [ref=f2e1863]:
              - cell [ref=f2e1864]:
                - strong [ref=f2e1865]: reliability gate
              - cell [ref=f2e1866]:
                - text: "The filter deciding whether measured data is trustworthy enough to learn from: declared/missing fields are refused;"
                - code [ref=f2e1867]: bpm
                - text: uses
                - code [ref=f2e1868]: tempo_confidence
                - text: (full ≥0.5, damped 0.35, unusable ≤0.2/missing); a centroid axis additionally needs ≥4 usable library values and a non-zero robust scale. Gated data produces honest notes, never zero-substitution.
            - row [ref=f2e1869]:
              - cell [ref=f2e1870]:
                - strong [ref=f2e1871]: centroid
              - cell "The evidence \"centre of mass\" per feature axis (e.g., bpm) of the tracks you kept / skipped this session; candidates near the kept centroid get a small, bounded pull (\"tempo ~126 BPM — you kept three such tracks\"). Gated by minimum counts and coverage; per-axis pull capped." [ref=f2e1872]
            - row [ref=f2e1873]:
              - cell [ref=f2e1874]:
                - strong [ref=f2e1875]: saturation bound
              - cell [ref=f2e1876]:
                - text: The total feedback adjustment is squeezed through
                - code [ref=f2e1877]: 0.15·tanh(v/2)
                - text: —
                - strong [ref=f2e1878]: never more than ±0.15
                - text: ", applied once, inside the strict tier only. It is a tiebreaker, never an override: hard constraints and explicit exclusions stay inviolable no matter how much evidence accumulates."
            - row [ref=f2e1879]:
              - cell [ref=f2e1880]:
                - strong [ref=f2e1881]: policy version
              - cell [ref=f2e1882]:
                - text: The label stamped on events and readouts for
                - emphasis [ref=f2e1883]: which meaning of the numbers
                - text: produced them (
                - code [ref=f2e1884]: heuristic-v1
                - text: or
                - code [ref=f2e1885]: epoch-v1
                - text: ). Any meaning change = new version + re-derive from the same immutable event log — never a migration. Rollback = switch
                - code [ref=f2e1886]: listening_policy
                - text: back (
                - code [ref=f2e1887]: legacy-v1
                - text: ).
            - row [ref=f2e1888]:
              - cell [ref=f2e1889]:
