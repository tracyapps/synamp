    - generic [ref=f1e218]:
      - heading "Corrections and disagreements" [level=2] [ref=f1e219]
      - paragraph [ref=f1e220]: The original report is a historical edition. Read these alongside it; archived claims and past test counts are not silently upgraded.
      - list [ref=f1e221]:
        - listitem [ref=f1e222]:
          - strong [ref=f1e223]: Original reports are historical.
          - text: Autoclaw captures describe its frozen feature commit. Current checks belong to a separate receipt; prior counts are not current claims.
        - listitem [ref=f1e224]:
          - strong [ref=f1e225]: Negative proposal acceptance.
          - text: The original H2/brief wording promises exclusion. The code applies a bounded global thumbs-down score; maintained product copy now says lower preference.
        - listitem [ref=f1e226]:
          - strong [ref=f1e227]: Memory statistic.
          - text: Janata 2007 reports a study-specific 30% average; Janata 2009 selected participants with at least 30% in earlier validation. The maintained dossier attribution is corrected; current source access was indexed primary-text excerpts, with direct full-text opening blocked.
        - listitem [ref=f1e228]:
          - strong [ref=f1e229]: Artist gate disagreement.
          - text: A3 prose says at least two distinct tracks; P17 and epoch-v1 count events. Keep the implemented rule until a versioned decision supported by evidence.
        - listitem [ref=f1e230]:
          - strong [ref=f1e231]: Dayparts and resets.
          - text: Frozen B2 decisions/code supersede A3 daypart ranges and missing-session semantics. A reset with non-epoch scope is ignored; remove with not_now is epoch-only.
        - listitem [ref=f1e232]:
          - strong [ref=f1e233]: Preliminary chapter state.
          - text: W1 source preamble says sequencing notes are unrendered; H2 added them. W2 cites an older lab hash; final H4 capture supersedes it.
        - listitem [ref=f1e234]:
          - strong [ref=f1e235]: Cross-session wording.
          - text: Proposals are the consent channel for inferred patterns. Explicit loves, thumbs and removes can also persist at their declared scope.
        - listitem [ref=f1e236]:
          - strong [ref=f1e237]: Rollback and smoke paths.
          - text: Archived reset --hard instructions apply to its feature branch, not current main. Archived .cluster smoke paths lived outside this repository. Use the maintained follow-up and scratch route checks.
        - listitem [ref=f1e238]:
          - strong [ref=f1e239]: Unsupported fields are not free.
          - text: Declared neutral soft terms dilute score gaps and can alter bounded feedback/MMR selection. Floor normalization is neutral only within a pure bundle, apart from truncation; mixed plans reweight.
        - listitem [ref=f1e240]:
          - strong [ref=f1e241]: Candidate evidence.
          - text: Weights, bands, proposal thresholds and fixed arcs are hypotheses. Synthetic fixtures prove invariants, not classifier accuracy, usefulness or cultural generality.
