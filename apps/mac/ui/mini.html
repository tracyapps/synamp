<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SynAmp mini player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Momo+Trust+Display&family=Space+Grotesk:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/ui.css">
  <link rel="stylesheet" href="panel.css">
  <style>
    /* The mini player: the song and its buttons, small enough to park in a corner.
       Skip, Love and Remove are split buttons like the player bar's: one shape,
       the action on the left and a small arrow for the other choices on the right.
       (Plain on purpose. Artwork and other looks can come later.) */
    .mini { display: grid; gap: 12px; padding: 4px 18px 16px; }
    .mini__song { min-width: 0; }
    .mini__title { margin: 0; font: 500 1rem/1.3 var(--font-sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini__artist { margin: 2px 0 0; min-height: 1.4em; color: var(--muted); font-size: 0.8125rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini__controls { display: flex; align-items: center; gap: 8px; }
    .mini__btn {
      display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%;
      border: 1px solid var(--border-strong); background: var(--ghost); color: var(--fg); cursor: pointer;
      transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
    }
    .mini__btn:hover:not(:disabled) { background: var(--ghost-hi); }
    .mini__btn:disabled { opacity: 0.4; cursor: default; }
    .mini__btn svg[hidden] { display: none; }
    .mini__btn--play { width: 46px; height: 46px; background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
    .mini__btn--play:hover:not(:disabled) { background: var(--gold-hi); border-color: var(--gold-hi); }

    .mini__split { display: inline-flex; align-items: stretch; flex: none; height: 40px; }
    .mini__split--end { margin-left: auto; }
    /* With an arrow, the pair is one pill with a hairline between its two halves. */
    .mini__split:has(.mini__more:not([hidden])) { border: 1px solid var(--border-strong); border-radius: var(--r-pill); background: var(--ghost); }
    .mini__split:has(.mini__more:not([hidden])) > .mini__btn,
    .mini__split:has(.mini__more:not([hidden])) > .mini__text { border: 0; background: none; border-radius: var(--r-pill) 0 0 var(--r-pill); height: auto; }
    .mini__split:has(.mini__more:not([hidden])) > .mini__btn { width: 42px; padding-left: 4px; }
    .mini__more {
      display: grid; place-items: center; min-width: 30px; padding: 0 8px 0 4px; border: 0; border-left: 1px solid var(--border);
      background: none; color: var(--fg); border-radius: 0 var(--r-pill) var(--r-pill) 0; cursor: pointer;
    }
    .mini__more[hidden] { display: none; }
    .mini__more svg { transform: rotate(90deg); }
    .mini__split > :hover:not(:disabled) { background: var(--ghost-hi); }
    .mini__split > :disabled { opacity: 0.4; cursor: default; }
    .mini__split > :focus-visible { outline-offset: -2px; }
    .mini__love[aria-pressed="true"] { color: var(--gold); }
    .mini__love[aria-pressed="true"] path { fill: currentColor; }
    .mini__split:has(.mini__more:not([hidden])):has(.mini__love[aria-pressed="true"]) { border-color: var(--gold); background: var(--gold-wash); }
    .mini__split:not(:has(.mini__more:not([hidden]))) > .mini__love[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-wash); }

    .mini__foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 34px; font-size: 0.8125rem; color: var(--muted); }
    .mini__split--text { height: 34px; }
    .mini__split--text[hidden] { display: none; }
    .mini__text {
      display: inline-flex; align-items: center; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--r-pill);
      background: var(--ghost); color: var(--fg); font: inherit; cursor: pointer;
    }
    .mini__open { margin-left: auto; background: none; border: 0; padding: 4px 0; min-height: 28px; color: var(--gold); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  </style>
  <script src="bridge.js"></script>
</head>
<body>
<main class="mini">
  <h1 class="visually-hidden">SynAmp mini player</h1>
  <div class="mini__song">
    <p class="mini__title" id="title">Nothing playing</p>
    <p class="mini__artist" id="artist"></p>
  </div>
  <div class="mini__controls" role="group" aria-label="Playback">
    <button type="button" class="mini__btn" id="previous" data-command="previous" aria-label="Previous track">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 20 9 12l10-8v16Z"/><path d="M5 19V5"/></svg>
    </button>
    <button type="button" class="mini__btn mini__btn--play" id="toggle" data-command="toggle" aria-label="Play">
      <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5Z"/></svg>
      <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="7" y="5" width="4" height="14" rx="1.4" fill="currentColor"/><rect x="13" y="5" width="4" height="14" rx="1.4" fill="currentColor"/></svg>
    </button>
    <span class="mini__split">
      <button type="button" class="mini__btn" id="next" data-command="next" aria-label="Skip to next track">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4l10 8-10 8V4Z"/><path d="M19 5v14"/></svg>
      </button>
      <button type="button" class="mini__more" data-menu="skip" aria-haspopup="menu" aria-label="Skip, and say why" title="Skip, and say why" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </span>
    <span class="mini__split mini__split--end">
      <button type="button" class="mini__btn mini__love" id="love" data-command="love" aria-label="Love" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5C19 15.6 12 20 12 20Z"/></svg>
      </button>
      <button type="button" class="mini__more" data-menu="love" aria-haspopup="menu" aria-label="More like this, and more" title="More like this, and more" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </span>
  </div>
  <div class="mini__foot">
    <span class="mini__split mini__split--text" id="remove-group" hidden>
      <button type="button" class="mini__text" id="remove" data-command="remove">Remove</button>
      <button type="button" class="mini__more" data-menu="remove" aria-haspopup="menu" aria-label="Remove, and say why" title="Remove, and say why">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </span>
    <button type="button" class="mini__open" id="open">Open SynAmp</button>
  </div>
</main>
<script>
(function () {
  const example = { view: { title: "An Ending (Ascent)", artist: "Brian Eno", paused: false, loved: false, busy: false, playlist: "no words, music to focus" } };
  const start = SynAmp.inApp ? SynAmp.state : Object.assign({}, example, SynAmp.state);
  const $ = (id) => document.getElementById(id);
  const actions = [...document.querySelectorAll("[data-command]")];
  const arrows = [...document.querySelectorAll("[data-menu]")];

  function show(view) {
    const playing = Boolean(view);
    $("title").textContent = playing ? view.title : "Nothing playing";
    $("artist").textContent = playing ? (view.artist || "") : "Open SynAmp and choose something to play.";
    const paused = !playing || view.paused;
    $("toggle").setAttribute("aria-label", paused ? "Play" : "Pause");
    $("icon-play").toggleAttribute("hidden", !paused);
    $("icon-pause").toggleAttribute("hidden", paused);
    const loved = playing && view.loved;
    $("love").setAttribute("aria-pressed", String(loved));
    $("love").setAttribute("aria-label", loved ? "Loved" : "Love");
    const busy = playing && view.busy;
    for (const button of actions) button.disabled = !playing || (busy && button.id !== "toggle" && button.id !== "previous");
    // Love can't be taken back from here.
    if (loved) $("love").disabled = true;
    // Only a playlist can learn from a reason, or have a song removed: no arrows and no Remove without one.
    const playlist = playing && Boolean(view.playlist);
    for (const arrow of arrows) { arrow.hidden = !playlist; arrow.disabled = busy; }
    $("remove-group").hidden = !playlist;
    $("remove").setAttribute("title", playlist ? "Remove from " + view.playlist + ", then skip" : "");
  }

  for (const button of actions) button.addEventListener("click", () => SynAmp.send("command", { name: button.dataset.command }));
  // The arrows open a real Mac menu, just under the arrow (it can be bigger than this small window).
  for (const arrow of arrows) arrow.addEventListener("click", () => {
    const box = arrow.closest(".mini__split").getBoundingClientRect();
    SynAmp.send("menu", { name: arrow.dataset.menu, x: Math.round(box.left), y: Math.round(box.bottom + 4) });
  });
  $("open").addEventListener("click", () => SynAmp.send("open"));
  SynAmp.on("player", (message) => show(message.view));
  show(start.view);
})();
</script>
</body>
</html>
