<!-- SynAmp's Mac app icon, as a page. Open it in a browser at 100% zoom and take
     a 1024 × 1024 screenshot with a transparent background to remake
     AppIcon-1024.png; then run ../scripts/make-icns.sh.

     Apple's icon grid: a 1024 canvas, the rounded square 824 wide with a 185
     corner, centred. The mark is the one the website and the app use
     (site/src/assets/img/synamp-mark.svg), tilted 9° counter-clockwise like the
     site's logo. Background: the brand's slate into near-black. -->
<html><body style="margin:0;background:transparent">
<div style="position:relative;width:1024px;height:1024px">
  <div style="position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:185px;
    background:radial-gradient(120% 120% at 30% 18%, #343b57 0%, #212637 46%, #0E0E10 100%);
    box-shadow:0 12px 24px rgba(0,0,0,.32), inset 0 2px 0 rgba(255,255,255,.10), inset 0 -2px 0 rgba(0,0,0,.35)"></div>
  <img src="../../../site/src/assets/img/synamp-mark.svg" alt="" style="position:absolute;left:197px;top:197px;width:630px;height:630px;transform:rotate(-9deg)">
</div></body></html>
