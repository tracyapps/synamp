<!doctype html>
<html lang="en">
<!-- The picture behind the icons in the "drag to install" window.
     Render it with apps/mac/dmg/render.mjs after changing it (660 × 462).
     Keep everything that matters in the top 400: people who have Finder's path
     bar and status bar switched on see that much, the rest is spare.
     Finder draws the two icons and their names on top:
       SynAmp at 170,190 · Applications at 490,190 · icons 128 px.
     Finder writes the names in black (light mode) or white (dark mode), so each
     name sits on a plate of #6774a0, which gives 4.58:1 with either. -->
<meta charset="utf-8">
<title>SynAmp installer background</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Momo+Trust+Display&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../web/src/styles/tokens.css">
<style>
  html, body { margin: 0; }
  body { width: 660px; height: 462px; overflow: hidden; position: relative; background: var(--bg); color: var(--fg); font-family: var(--font-sans); }
  /* A soft glow behind each icon, gold on the side you drag to. */
  .glow { position: absolute; width: 300px; height: 300px; border-radius: 50%; top: 40px; filter: blur(8px); }
  .glow--app { left: 20px; background: radial-gradient(closest-side, rgba(255,255,255,.07), transparent); }
  .glow--apps { left: 340px; background: radial-gradient(closest-side, rgba(255,205,0,.13), transparent); }
  .step { position: absolute; top: 26px; left: 0; right: 0; text-align: center; }
  .step__eyebrow { font: 500 11px/1.4 var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin: 0 0 4px; }
  .step__title { font: 400 26px/1.15 var(--font-display); margin: 0; letter-spacing: -.01em; }
  .arrow { position: absolute; left: 270px; top: 166px; width: 120px; height: 48px; }
  .plate { position: absolute; top: 259px; height: 26px; width: 150px; border-radius: 13px; background: #6774a0; }
  .plate--app { left: 95px; }
  .plate--apps { left: 415px; }
  .after { position: absolute; left: 0; right: 0; top: 318px; text-align: center; margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
  .after strong { color: var(--fg); font-weight: 500; }
  .edge { position: absolute; inset: auto 0 0 0; height: 4px; background: var(--gold); }
</style>
<div class="glow glow--app"></div>
<div class="glow glow--apps"></div>
<div class="step">
  <p class="step__eyebrow">Install</p>
  <h1 class="step__title">Drag SynAmp into Applications</h1>
</div>
<svg class="arrow" viewBox="0 0 120 48" fill="none" stroke="#ffcd00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M6 24h100"/><path d="M88 6l20 18-20 18"/>
</svg>
<div class="plate plate--app"></div>
<div class="plate plate--apps"></div>
<p class="after">Then open <strong>SynAmp</strong> from Applications. It lives in your menu bar.</p>
<div class="edge"></div>
</html>
